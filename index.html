<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Archive</title>
  <style>
    :root{color-scheme:dark;--bg:#080b14;--panel:#111827;--line:#25314a;--text:#f8fafc;--muted:#94a3b8;--accent:#8b5cf6}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#1c1640 0,transparent 36%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}
    main{max-width:1120px;margin:auto;padding:52px 24px 80px}.eyebrow{color:#a78bfa;letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:700}h1{font-size:clamp(36px,7vw,72px);letter-spacing:-.06em;line-height:1;margin:14px 0}header p{color:var(--muted);font-size:17px;max-width:620px}.toolbar{display:flex;gap:12px;margin:36px 0 24px}.toolbar input{width:100%;background:#0d1423;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px 16px;outline:none}.toolbar input:focus{border-color:var(--accent)}#status{color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}.card{overflow:hidden;background:rgba(17,24,39,.86);border:1px solid var(--line);border-radius:18px;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:#6651b8}.thumb{aspect-ratio:16/9;background:#182235;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.play{font-size:32px;color:#c4b5fd}.body{padding:18px}.body h2{font-size:17px;line-height:1.3;margin:0 0 10px}.meta{color:var(--muted);font-size:13px}.links{display:flex;gap:10px;margin-top:16px}.links a{color:#c4b5fd;text-decoration:none;font-weight:650}.empty{padding:60px 20px;border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted)}
  </style>
</head>
<body><main>
  <header><div class="eyebrow">Private media library</div><h1>Video Archive</h1><p>Preserved links, metadata, and downloadable archive artifacts in one quiet place.</p></header>
  <div class="toolbar"><input id="search" type="search" placeholder="Search archived videos…" aria-label="Search archived videos" /></div>
  <p id="status">Loading archive…</p><section id="grid" class="grid"></section>
</main><script>
  const grid=document.querySelector('#grid'),status=document.querySelector('#status'),search=document.querySelector('#search');let videos=[];
  const esc=(v)=>String(v??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const duration=(s)=>{if(!Number.isFinite(s))return '';const m=Math.floor(s/60),sec=String(Math.floor(s%60)).padStart(2,'0');return `${m}:${sec}`};
  function render(){const q=search.value.trim().toLowerCase();const shown=videos.filter(v=>`${v.title} ${v.uploader??''} ${v.sourceUrl??''}`.toLowerCase().includes(q));status.textContent=`${shown.length} archived video${shown.length===1?'':'s'}`;grid.innerHTML=shown.length?shown.map(v=>`<article class="card"><div class="thumb">${v.thumbnail?`<img loading="lazy" src="${esc(v.thumbnail)}" alt="">`:'<span class="play">▶</span>'}</div><div class="body"><h2>${esc(v.title)}</h2><div class="meta">${esc(v.uploader||'Unknown creator')}${v.duration?' · '+duration(v.duration):''}</div><div class="meta">Archived ${v.archivedAt?new Date(v.archivedAt).toLocaleDateString():''}</div><div class="links">${v.sourceUrl?`<a href="${esc(v.sourceUrl)}" target="_blank" rel="noreferrer">Source ↗</a>`:''}${v.artifactRunUrl?`<a href="${esc(v.artifactRunUrl)}" target="_blank" rel="noreferrer">Artifact ↗</a>`:''}</div></div></article>`).join(''):'<div class="empty">No archived videos yet. Run the Archive video workflow from GitHub Actions to add one.</div>'}
  fetch('data/videos.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).then(v=>{videos=Array.isArray(v)?v:[];render()}).catch(()=>{status.textContent='Could not load archive metadata';render()});search.addEventListener('input',render);
</script></body></html>
