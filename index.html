<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0f">
  <title>Video Archive</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0c0f;--surface:#121419;--surface-2:#181b21;--line:#282c34;--text:#f1f3f5;--muted:#8d949f;--accent:#e9edf2;--focus:#9cc5ff;--radius:14px}
    *{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;color:var(--text);font:15px/1.5 Inter,Geist,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{color:inherit}a{color:inherit}
    .shell{max-width:1280px;margin:auto;padding:0 28px 72px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:-.02em}.brand-mark{width:27px;height:27px;border:1px solid #5f6875;border-radius:8px;display:grid;place-items:center;font-size:11px}.count{color:var(--muted);font-size:13px}
    .intro{padding:70px 0 38px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:48px;align-items:end}.kicker{margin:0 0 16px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.intro h1{max-width:700px;margin:0;font-size:clamp(42px,6vw,76px);line-height:.98;letter-spacing:-.075em;font-weight:680}.intro-copy{color:var(--muted);margin:0 0 4px;max-width:320px}
    .controls{display:flex;align-items:center;gap:10px;margin:0 0 24px}.search-wrap{position:relative;flex:1}.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}#search{width:100%;height:46px;padding:0 16px 0 42px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;outline:0}#search:focus{border-color:#66717f;box-shadow:0 0 0 3px rgba(156,197,255,.12)}.select{height:46px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:0 13px;outline:0}.select:focus{border-color:#66717f}.status{margin:0 0 14px;color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:border-color .2s,transform .2s,background .2s}.card:hover{border-color:#56606d;background:var(--surface-2);transform:translateY(-2px)}.card:focus-within{outline:2px solid var(--focus);outline-offset:2px}.thumb{position:relative;aspect-ratio:16/10;background:#1a1d23;overflow:hidden}.thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s;opacity:.9}.card:hover .thumb img{transform:scale(1.035)}.thumb-empty{height:100%;display:grid;place-items:center;color:#666e7a;font-size:28px}.play-chip{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:7px;background:rgba(11,12,15,.88);border:1px solid #414751;font-size:12px;font-weight:650}.play-dot{width:17px;height:17px;border-radius:50%;background:#e9edf2;color:#0b0c0f;display:grid;place-items:center;font-size:8px}.card-body{padding:14px}.card-title{margin:0 0 8px;font-size:15px;line-height:1.3;letter-spacing:-.015em;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:7px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:8px;margin-top:14px}.play-button,.source-link{height:32px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.play-button{background:#e9edf2;color:#0b0c0f;border-color:#e9edf2;font-weight:650}.play-button:hover{background:#fff}.source-link{color:var(--muted)}.source-link:hover{color:var(--text);border-color:#66717f}.empty{grid-column:1/-1;padding:58px 20px;border:1px dashed var(--line);border-radius:var(--radius);text-align:center;color:var(--muted)}
    .modal[hidden]{display:none}.modal{position:fixed;z-index:20;inset:0;background:rgba(4,5,7,.9);display:grid;place-items:center;padding:24px}.modal-panel{width:min(1020px,100%);background:var(--surface);border:1px solid #3a404a;border-radius:var(--radius);overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.55)}.modal-head{height:58px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 18px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}.close{width:34px;height:34px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:24px;cursor:pointer}.close:hover{background:var(--surface-2);color:var(--text)}.player{aspect-ratio:16/9;background:#050608}.player iframe,.player video{display:block;width:100%;height:100%;border:0}.modal-note{padding:10px 18px;color:var(--muted);font-size:12px}
    @media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.shell{padding:0 16px 48px}.topbar{height:62px}.intro{padding:48px 0 30px;display:block}.intro h1{font-size:clamp(43px,14vw,66px)}.intro-copy{margin-top:20px}.controls{position:sticky;top:0;z-index:5;padding:10px 0;background:rgba(11,12,15,.94);backdrop-filter:blur(12px);margin:0 -1px 18px}.select{width:44px;padding:0;font-size:0;background:var(--surface) }.select:after{content:'☷';font-size:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card-body{padding:12px}.card-title{font-size:14px}.meta{font-size:11px}.actions{margin-top:12px}.play-button,.source-link{height:34px;padding:0 9px}.modal{padding:10px}.modal-panel{border-radius:10px}.modal-head{height:52px;padding:0 13px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.thumb{aspect-ratio:16/9}}
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar"><div class="brand"><span class="brand-mark">▶</span><span>Video Archive</span></div><span class="count" id="total-count">Private library</span></nav>
    <header class="intro"><div><p class="kicker">Collected / indexed</p><h1>A quiet place for your videos.</h1></div><p class="intro-copy">Browse preserved recordings, stream them directly, and keep the archive close at hand.</p></header>
    <div class="controls"><label class="search-wrap"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" type="search" placeholder="Search videos…" aria-label="Search archived videos"></label><select id="sort" class="select" aria-label="Sort videos"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="title">Title</option></select></div>
    <p id="status" class="status">Loading archive…</p><section id="grid" class="grid" aria-live="polite"></section>
  </main>
  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-panel"><div class="modal-head"><h2 id="modal-title">Video preview</h2><button class="close" type="button" aria-label="Close video player">×</button></div><div id="player" class="player"></div><div class="modal-note">Google Drive streams in its hosted preview to avoid cross-origin playback issues.</div></div></div>
  <script>
    const grid=document.querySelector('#grid'),status=document.querySelector('#status'),search=document.querySelector('#search'),sort=document.querySelector('#sort'),modal=document.querySelector('#modal'),player=document.querySelector('#player'),modalTitle=document.querySelector('#modal-title'),closeButton=document.querySelector('.close'),totalCount=document.querySelector('#total-count');let videos=[];
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const duration=s=>{if(!Number.isFinite(Number(s)))return '';const m=Math.floor(s/60),sec=String(Math.floor(s%60)).padStart(2,'0');return `${m}:${sec}`};
    function fileId(url){try{const m=String(url||'').match(/\/file\/d\/([\w-]+)/);return m?.[1]||new URL(url).searchParams.get('id')}catch{return null}}
    function playable(v){const artifact=v.artifactRunUrl||'';const id=fileId(artifact);if(id)return {type:'iframe',url:`https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`};const direct=v.videoUrl||v.sourceUrl||'';return direct?{type:'video',url:direct}:null}
    function openPlayer(v){const media=playable(v);if(!media)return;modalTitle.textContent=v.title||'Video preview';player.innerHTML=media.type==='iframe'?`<iframe src="${esc(media.url)}" allow="autoplay; fullscreen" allowfullscreen title="${esc(v.title||'Video preview')}"></iframe>`:`<video src="${esc(media.url)}" controls autoplay playsinline preload="metadata"></video>`;modal.hidden=false;document.body.style.overflow='hidden';closeButton.focus()}
    function closePlayer(){const video=player.querySelector('video');if(video)video.pause();player.replaceChildren();modal.hidden=true;document.body.style.overflow=''}
    function render(){const q=search.value.trim().toLowerCase();let shown=videos.filter(v=>`${v.title||''} ${v.uploader||''} ${v.sourceUrl||''}`.toLowerCase().includes(q));shown.sort((a,b)=>sort.value==='title'?String(a.title||'').localeCompare(String(b.title||'')):sort.value==='oldest'?new Date(a.archivedAt||0)-new Date(b.archivedAt||0):new Date(b.archivedAt||0)-new Date(a.archivedAt||0));status.textContent=`${shown.length} archived video${shown.length===1?'':'s'}`;grid.innerHTML=shown.length?shown.map((v,i)=>{const media=playable(v);return `<article class="card" data-index="${i}"><div class="thumb">${v.thumbnail?`<img loading="lazy" src="${esc(v.thumbnail)}" alt="">`:'<div class="thumb-empty">▶</div>'}${media?'<span class="play-chip"><span class="play-dot">▶</span>Play</span>':''}</div><div class="card-body"><h2 class="card-title" title="${esc(v.title)}">${esc(v.title||'Untitled video')}</h2><div class="meta"><span>${esc(v.uploader||'Unknown creator')}</span>${v.duration?`<span>·</span><span>${duration(v.duration)}</span>`:''}</div><div class="meta"><span>${v.archivedAt?new Date(v.archivedAt).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'Archive date unknown'}</span></div><div class="actions">${media?'<button class="play-button" type="button">Play</button>':''}${v.sourceUrl?`<a class="source-link" href="${esc(v.sourceUrl)}" target="_blank" rel="noreferrer">Source ↗</a>`:''}</div></div></article>`}).join(''):'<div class="empty">No videos match your search.</div>';grid.querySelectorAll('.card').forEach(card=>{card.addEventListener('click',e=>{if(e.target.closest('a'))return;openPlayer(shown[Number(card.dataset.index)])})})}
    fetch('data/videos.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(v=>{videos=Array.isArray(v)?v:[];totalCount.textContent=`${videos.length} item${videos.length===1?'':'s'} indexed`;render()}).catch(()=>{status.textContent='Could not load archive metadata';grid.innerHTML='<div class="empty">Archive metadata is unavailable right now.</div>'});search.addEventListener('input',render);sort.addEventListener('change',render);closeButton.addEventListener('click',closePlayer);modal.addEventListener('click',e=>{if(e.target===modal)closePlayer()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closePlayer()});
  </script>
</body>
</html>
