<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23675cff'/%3E%3Cpath d='M188 140h136c20 0 36 16 36 36v160c0 20-16 36-36 36H188c-20 0-36-16-36-36V176c0-20 16-36 36-36Z' fill='white'/%3E%3Cpath d='m230 206 100 50-100 50v-100Z' fill='%23675cff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,0,0" rel="stylesheet">
<title>Video Archive</title>
<style>
:root{color-scheme:dark;--bg:#121212;--surface:#1d1b20;--surface2:#25232a;--primary:#d0bcff;--on:#e6e1e5;--muted:#cac4d0;--outline:#938f99}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--on);font:14px Roboto,system-ui,sans-serif}.app{max-width:1280px;margin:auto;padding:0 24px 80px}.appbar{height:72px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5;background:rgba(18,18,18,.92);backdrop-filter:blur(18px);border-bottom:1px solid #2b292f}.brand-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#6750a4;color:#fff;box-shadow:0 4px 12px #0006}.brand{font-size:20px;font-weight:500;letter-spacing:.1px}.appbar-meta{margin-left:auto;color:var(--muted);font-size:13px}.hero{padding:54px 0 38px;display:flex;justify-content:space-between;align-items:end;gap:32px}.eyebrow{color:var(--primary);font-size:12px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;margin:0 0 16px}.hero h1{font-size:clamp(42px,7vw,78px);line-height:.98;letter-spacing:-2.5px;margin:0;font-weight:500}.hero-copy{max-width:290px;color:var(--muted);line-height:1.55;margin:0}.toolbar{display:flex;gap:12px;align-items:center;padding:16px 0;border-top:1px solid #302e33;border-bottom:1px solid #302e33}.field{height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--outline);border-radius:8px;background:var(--surface);max-width:480px;flex:1}.field:focus-within{border:2px solid var(--primary)}.field input{min-width:0;flex:1;background:none;border:0;outline:0;color:var(--on);font:inherit}.material-symbols-rounded{font-size:21px}.select{height:48px;border:1px solid var(--outline);border-radius:8px;background:var(--surface);color:var(--on);padding:0 12px;font:inherit}.result{margin-left:auto;color:var(--muted);font-size:13px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:680px}.table th{text-align:left;color:var(--muted);font-size:12px;font-weight:500;padding:18px 14px 8px}.table td{padding:12px 14px;background:var(--surface);vertical-align:middle}.table td:first-child{border-radius:12px 0 0 12px}.table td:last-child{border-radius:0 12px 12px 0}.row:hover td{background:var(--surface2)}.thumb{width:112px;height:64px;border-radius:8px;object-fit:cover;background:#302e33;display:block}.title{font-size:15px;font-weight:500;max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub,.date,.duration{color:var(--muted);font-size:12px;margin-top:5px}.badge{display:inline-flex;align-items:center;border-radius:999px;background:#332f3d;color:var(--primary);padding:6px 10px;font-size:12px;white-space:nowrap}.actions{display:flex;gap:8px;justify-content:flex-end}.btn{height:40px;border:0;border-radius:20px;padding:0 16px;display:inline-flex;align-items:center;gap:6px;font:500 13px Roboto;cursor:pointer;text-decoration:none;transition:filter .15s,transform .1s}.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(1.15)}.play{background:var(--primary);color:#24153f}.source{background:transparent;color:var(--primary);border:1px solid #79747e}.empty{text-align:center;color:var(--muted);padding:48px!important}.sheet{position:fixed;inset:auto 0 0;z-index:10;background:#211f24;border-radius:28px 28px 0 0;box-shadow:0 -12px 40px #000a;transform:translateY(110%);transition:transform .25s ease}.sheet.open{transform:none}.sheet-head{max-width:1000px;margin:auto;height:64px;padding:0 20px;display:flex;align-items:center;gap:12px}.sheet-title{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.close{margin-left:auto;background:#36333b;color:var(--on);border:0;border-radius:50%;width:40px;height:40px;cursor:pointer}.player{max-width:1000px;margin:auto;aspect-ratio:16/9;background:#000}.player iframe,.player video{width:100%;height:100%;border:0;display:block}.note{max-width:1000px;margin:auto;padding:12px 20px 18px;color:var(--muted);font-size:11px}@media(max-width:700px){.app{padding:0 16px 64px}.appbar{height:64px}.appbar-meta{display:none}.hero{display:block;padding:40px 0 30px}.hero-copy{margin-top:22px}.toolbar{position:sticky;top:64px;z-index:4;background:rgba(18,18,18,.94)}.select{width:48px;font-size:0}.select:after{content:'↕';font-size:18px}.result{display:none}.table{min-width:620px}.table th,.table td{padding-left:8px;padding-right:8px}.thumb{width:92px;height:54px}.title{max-width:230px}.source{display:none}}
</style></head>
<body><main class="app"><header class="appbar"><div class="brand-icon"><span class="material-symbols-rounded">movie</span></div><div class="brand">Video Archive</div><div id="count" class="appbar-meta">Loading…</div></header>
<section class="hero"><div><p class="eyebrow">Private index · 2026</p><h1>Recorded.<br>Preserved.</h1></div><p class="hero-copy">A calm, searchable home for the moments worth keeping. Browse the archive and play any recording instantly.</p></section>
<div class="toolbar"><label class="field"><span class="material-symbols-rounded">search</span><input id="search" type="search" placeholder="Search title or uploader" aria-label="Search videos"></label><select id="sort" class="select" aria-label="Sort videos"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="title">Title</option></select><span id="result" class="result">Loading…</span></div>
<div class="table-wrap"><table class="table"><thead><tr><th>Preview</th><th>Video</th><th>Duration</th><th>Archived</th><th></th></tr></thead><tbody id="list"></tbody></table></div></main>
<aside id="sheet" class="sheet" aria-label="Video player"><div class="sheet-head"><span class="material-symbols-rounded">play_circle</span><div id="sheet-title" class="sheet-title">Preview</div><button id="close" class="close" aria-label="Close player"><span class="material-symbols-rounded">close</span></button></div><div id="player" class="player"></div><div class="note">Google Drive playback uses the official hosted preview.</div></aside>
<script>
const $=s=>document.querySelector(s),list=$('#list'),search=$('#search'),sort=$('#sort'),sheet=$('#sheet'),player=$('#player'),sheetTitle=$('#sheet-title');let videos=[];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idFrom=v=>{let m=String(v.artifactRunUrl||'').match(/\/file\/d\/([\w-]+)/);return m&&m[1]};
const media=v=>{let id=idFrom(v);if(id)return['iframe',`https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`];return v.videoUrl?['video',v.videoUrl]:null};
const dur=x=>Number.isFinite(+x)?`${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,'0')}`:'—';
function open(v){let m=media(v);if(!m)return;sheetTitle.textContent=v.title||'Untitled video';player.innerHTML=m[0]==='iframe'?`<iframe src="${esc(m[1])}" allow="autoplay; fullscreen" allowfullscreen title="Video preview"></iframe>`:`<video src="${esc(m[1])}" controls autoplay playsinline></video>`;sheet.classList.add('open');document.body.style.overflow='hidden'}
function close(){player.replaceChildren();sheet.classList.remove('open');document.body.style.overflow=''}
function render(){let q=search.value.toLowerCase().trim(),a=videos.filter(v=>`${v.title||''} ${v.uploader||''}`.toLowerCase().includes(q));a.sort((x,y)=>sort.value==='title'?String(x.title||'').localeCompare(y.title||''):sort.value==='oldest'?new Date(x.archivedAt||0)-new Date(y.archivedAt||0):new Date(y.archivedAt||0)-new Date(x.archivedAt||0));$('#result').textContent=`${a.length} of ${videos.length}`;list.innerHTML=a.length?a.map((v,i)=>{let m=media(v);return `<tr class="row" data-i="${i}"><td>${v.thumbnail?`<img class="thumb" loading="lazy" src="${esc(v.thumbnail)}" alt="">`:'<div class="thumb"></div>'}</td><td><div class="title" title="${esc(v.title)}">${esc(v.title||'Untitled video')}</div><div class="sub">${esc(v.uploader||'Unknown uploader')}</div></td><td><span class="badge">${dur(v.duration)}</span></td><td class="date">${v.archivedAt?new Date(v.archivedAt).toISOString().slice(0,10):'—'}</td><td><div class="actions">${m?'<button class="btn play"><span class="material-symbols-rounded">play_arrow</span>Play</button>':''}${v.sourceUrl?`<a class="btn source" href="${esc(v.sourceUrl)}" target="_blank" rel="noreferrer">Open ↗</a>`:''}</div></td></tr>`}).join(''):'<tr><td colspan="5" class="empty">No matching records.</td></tr>';list.querySelectorAll('.row').forEach(r=>r.addEventListener('click',e=>{if(e.target.closest('a'))return;open(a[+r.dataset.i])}))}
fetch('data/videos.json').then(r=>r.ok?r.json():Promise.reject()).then(x=>{videos=Array.isArray(x)?x:[];$('#count').textContent=`${videos.length} recordings`;render()}).catch(()=>{$('#result').textContent='Unavailable';list.innerHTML='<tr><td colspan="5" class="empty">Archive metadata unavailable.</td></tr>'});search.addEventListener('input',render);sort.addEventListener('change',render);$('#close').addEventListener('click',close);document.addEventListener('keydown',e=>e.key==='Escape'&&close());if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
