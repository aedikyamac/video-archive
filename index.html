<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Video Archive</title>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#0a0a0a;--line:#1a1a1a;--line-hi:#303030;--text:#f5f5f5;--muted:#777;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:1440px;margin:auto;padding:0 24px 72px}.header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;position:sticky;top:0;z-index:5;background:rgba(0,0,0,.94);backdrop-filter:blur(12px)}.wordmark{font-weight:650;letter-spacing:-.02em;white-space:nowrap}.wordmark b{font-family:var(--mono);font-size:11px;color:#777;margin-right:10px}.header-meta,.mono{font:11px var(--mono);color:var(--muted)}.hero{padding:64px 0 38px;border-bottom:1px solid var(--line);display:flex;align-items:end;justify-content:space-between;gap:32px}.eyebrow{font:11px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:#666;margin:0 0 16px}.hero h1{font-size:clamp(40px,7vw,84px);letter-spacing:-.08em;line-height:.9;margin:0;font-weight:620}.hero-copy{max-width:280px;color:#777;margin:0}.toolbar{height:72px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.search{height:36px;flex:1;max-width:420px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:0 12px;outline:0}.search:focus{border-color:#555}.sort{height:36px;background:var(--panel);color:var(--muted);border:1px solid var(--line);padding:0 10px;outline:0}.result{margin-left:auto}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#555;font:10px var(--mono);font-weight:400;text-transform:uppercase;letter-spacing:.1em;padding:15px 12px;border-bottom:1px solid var(--line)}.table td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}.row{transition:background .12s}.row:hover{background:#080808}.title{font-weight:550;max-width:560px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font:11px var(--mono);color:#666;margin-top:3px}.thumb{width:104px;height:58px;object-fit:cover;display:block;background:#111;filter:grayscale(1)}.date,.duration{font:11px var(--mono);color:#888;white-space:nowrap}.actions{display:flex;justify-content:flex-end;gap:8px}.play,.source{height:30px;border:1px solid var(--line-hi);background:transparent;color:#ddd;padding:0 10px;font-size:12px;text-decoration:none;display:inline-flex;align-items:center}.play:hover,.source:hover{border-color:#777;color:#fff}.play{background:#eee;color:#000;border-color:#eee;font-weight:650}.empty{padding:56px 12px;color:#666;text-align:center;border-bottom:1px solid var(--line)}.drawer{position:fixed;z-index:10;right:0;bottom:0;left:0;background:#050505;border-top:1px solid #333;box-shadow:0 -20px 70px #000;transform:translateY(105%);transition:transform .22s ease}.drawer.open{transform:none}.drawer-head{height:48px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.drawer-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.close{border:0;background:transparent;color:#777;font-size:22px;padding:2px 8px}.player{max-width:1000px;margin:auto;aspect-ratio:16/9;background:#000}.player iframe,.player video{width:100%;height:100%;border:0;display:block}.note{max-width:1000px;margin:auto;padding:9px 0;color:#555;font:10px var(--mono)}
@media(max-width:700px){.app{padding:0 14px 56px}.header{height:52px}.header-meta{display:none}.hero{padding:42px 0 28px;display:block}.hero-copy{margin-top:22px}.toolbar{height:64px;position:sticky;top:52px;z-index:4;background:rgba(0,0,0,.94)}.search{max-width:none}.sort{width:38px;font-size:0}.sort:after{content:'↕';font-size:16px}.result{display:none}.table th{padding:12px 6px}.table td{padding:11px 6px}.table th:first-child,.table td:first-child{display:none}.thumb{width:84px;height:48px}.title{max-width:calc(100vw - 190px)}.date{font-size:10px}.actions{gap:4px}.source{display:none}.play{padding:0 8px}.drawer-head{padding:0 12px}.note{padding:8px 12px}}
</style>
</head>
<body>
<main class="app">
<header class="header"><div class="wordmark"><b>VA/01</b>Video Archive</div><div id="count" class="header-meta">— items</div></header>
<section class="hero"><div><p class="eyebrow">Private index / 2026</p><h1>Recorded.<br>Preserved.</h1></div><p class="hero-copy">A compact interface for browsing and playing the archive. No ornament, no noise.</p></section>
<div class="toolbar"><input id="search" class="search" type="search" placeholder="Filter by title or uploader" aria-label="Filter videos"><select id="sort" class="sort" aria-label="Sort videos"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="title">Title</option></select><span id="result" class="result mono">loading</span></div>
<table class="table"><thead><tr><th>Preview</th><th>Video</th><th>Duration</th><th>Archived</th><th></th></tr></thead><tbody id="list"></tbody></table>
</main>
<aside id="drawer" class="drawer" aria-label="Video player"><div class="drawer-head"><div id="drawer-title" class="drawer-title">Preview</div><button id="close" class="close" aria-label="Close player">×</button></div><div id="player" class="player"></div><div class="note">Google Drive playback uses the official hosted preview.</div></aside>
<script>
const $=s=>document.querySelector(s),list=$('#list'),search=$('#search'),sort=$('#sort'),drawer=$('#drawer'),player=$('#player'),title=$('#drawer-title');let videos=[];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idFrom=v=>{try{let m=String(v.artifactRunUrl||'').match(/\/file\/d\/([\w-]+)/);return m&&m[1]}catch{return null}};
const media=v=>{let id=idFrom(v);if(id)return['iframe',`https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`];let u=v.videoUrl||'';return u?['video',u]:null};
const dur=x=>Number.isFinite(+x)?`${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,'0')}`:'—';
function open(v){let m=media(v);if(!m)return;title.textContent=v.title||'Untitled video';player.innerHTML=m[0]==='iframe'?`<iframe src="${esc(m[1])}" allow="autoplay; fullscreen" allowfullscreen title="Video preview"></iframe>`:`<video src="${esc(m[1])}" controls autoplay playsinline></video>`;drawer.classList.add('open');document.body.style.overflow='hidden'}
function close(){player.replaceChildren();drawer.classList.remove('open');document.body.style.overflow=''}
function render(){let q=search.value.toLowerCase().trim(),a=videos.filter(v=>`${v.title||''} ${v.uploader||''}`.toLowerCase().includes(q));a.sort((x,y)=>sort.value==='title'?String(x.title||'').localeCompare(y.title||''):sort.value==='oldest'?new Date(x.archivedAt||0)-new Date(y.archivedAt||0):new Date(y.archivedAt||0)-new Date(x.archivedAt||0));$('#result').textContent=`${a.length} / ${videos.length}`;list.innerHTML=a.length?a.map((v,i)=>{let m=media(v);return `<tr class="row" data-i="${i}"><td>${v.thumbnail?`<img class="thumb" loading="lazy" src="${esc(v.thumbnail)}" alt="">`:'<div class="thumb"></div>'}</td><td><div class="title" title="${esc(v.title)}">${esc(v.title||'Untitled video')}</div><div class="sub">${esc(v.uploader||'Unknown uploader')}</div></td><td class="duration">${dur(v.duration)}</td><td class="date">${v.archivedAt?new Date(v.archivedAt).toISOString().slice(0,10):'—'}</td><td><div class="actions">${m?'<button class="play">Play</button>':''}${v.sourceUrl?`<a class="source" href="${esc(v.sourceUrl)}" target="_blank" rel="noreferrer">Open ↗</a>`:''}</div></td></tr>`}).join(''):'<tr><td colspan="5" class="empty">No matching records.</td></tr>';list.querySelectorAll('.row').forEach(r=>r.addEventListener('click',e=>{if(e.target.closest('a'))return;open(a[+r.dataset.i])}))}
fetch('data/videos.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(x=>{videos=Array.isArray(x)?x:[];$('#count').textContent=`${videos.length} items`;render()}).catch(()=>{$('#result').textContent='unavailable';list.innerHTML='<tr><td colspan="5" class="empty">Archive metadata unavailable.</td></tr>'});search.addEventListener('input',render);sort.addEventListener('change',render);$('#close').addEventListener('click',close);document.addEventListener('keydown',e=>e.key==='Escape'&&close());
</script>
</body>
</html>
