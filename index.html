<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Archive</title>
  <style>
    :root{color-scheme:dark;--bg:#080b14;--panel:#111827;--line:#25314a;--text:#f8fafc;--muted:#94a3b8;--accent:#8b5cf6}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#1c1640 0,transparent 36%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}
    main{max-width:1120px;margin:auto;padding:52px 24px 80px}.eyebrow{color:#a78bfa;letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:700}h1{font-size:clamp(36px,7vw,72px);letter-spacing:-.06em;line-height:1;margin:14px 0}header p{color:var(--muted);font-size:17px;max-width:620px}.toolbar{display:flex;gap:12px;margin:36px 0 24px}.toolbar input{width:100%;background:#0d1423;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px 16px;outline:none}.toolbar input:focus{border-color:var(--accent)}#status{color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}.card{overflow:hidden;background:rgba(17,24,39,.86);border:1px solid var(--line);border-radius:18px;transition:transform .2s,border-color .2s;cursor:pointer}.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:#6651b8;outline:none}.thumb{aspect-ratio:16/9;background:#182235;display:grid;place-items:center;overflow:hidden;position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.play{font-size:32px;color:#c4b5fd}.play-badge{position:absolute;inset:auto auto 14px 14px;background:rgba(8,11,20,.84);border:1px solid #6651b8;border-radius:999px;padding:7px 12px;color:#ddd6fe;font-weight:700}.body{padding:18px}.body h2{font-size:17px;line-height:1.3;margin:0 0 10px}.meta{color:var(--muted);font-size:13px}.links{display:flex;gap:10px;margin-top:16px;align-items:center}.links a,.play-button{color:#c4b5fd;text-decoration:none;font-weight:650}.play-button{background:#251d4d;border:1px solid #6651b8;border-radius:8px;padding:7px 11px;cursor:pointer;font:inherit}.links a:hover,.play-button:hover{color:#fff;background:#322466}.empty{padding:60px 20px;border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted)}
    .modal[hidden]{display:none}.modal{position:fixed;z-index:10;inset:0;background:rgba(2,4,10,.84);backdrop-filter:blur(10px);display:grid;place-items:center;padding:24px}.modal-panel{width:min(980px,100%);background:#0d1423;border:1px solid #34405c;border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.55);overflow:hidden}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.close{border:0;background:transparent;color:var(--muted);font-size:28px;line-height:1;cursor:pointer}.close:hover{color:var(--text)}.player{aspect-ratio:16/9;background:#02040a}.player iframe,.player video{display:block;width:100%;height:100%;border:0}.modal-note{padding:10px 20px;color:var(--muted);font-size:12px}
  </style>
</head>
<body><main>
  <header><div class="eyebrow">Private media library</div><h1>Video Archive</h1><p>Preserved links, metadata, and downloadable archive artifacts in one quiet place.</p></header>
  <div class="toolbar"><input id="search" type="search" placeholder="Search archived videos…" aria-label="Search archived videos" /></div>
  <p id="status">Loading archive…</p><section id="grid" class="grid"></section>
</main>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-panel"><div class="modal-head"><h2 id="modal-title">Video preview</h2><button class="close" type="button" aria-label="Close video player">×</button></div><div id="player" class="player"></div><div class="modal-note">Press Escape or click outside the player to close.</div></div></div>
<script>
  const grid=document.querySelector('#grid'),status=document.querySelector('#status'),search=document.querySelector('#search'),modal=document.querySelector('#modal'),player=document.querySelector('#player'),modalTitle=document.querySelector('#modal-title'),closeButton=document.querySelector('.close');let videos=[];
  const esc=(v)=>String(v??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const duration=(s)=>{if(!Number.isFinite(s))return '';const m=Math.floor(s/60),sec=String(Math.floor(s%60)).padStart(2,'0');return `${m}:${sec}`};
  function fileId(url){try{const match=String(url||'').match(/\/file\/d\/([a-zA-Z0-9_-]+)/);return match?.[1]||new URL(url).searchParams.get('id')}catch{return null}}
  function playable(v){const artifact=v.artifactRunUrl||'';const id=fileId(artifact);if(id)return {type:'iframe',url:`https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`};const direct=v.videoUrl||v.sourceUrl||artifact;if(/\.(mp4|webm|ogg)(?:[?#]|$)/i.test(direct))return {type:'video',url:direct};return direct?{type:'video',url:direct}:null}
  function openPlayer(v){const media=playable(v);if(!media)return;modalTitle.textContent=v.title||'Video preview';player.innerHTML=media.type==='iframe'?`<iframe src="${esc(media.url)}" allow="autoplay; fullscreen" allowfullscreen title="${esc(v.title||'Video preview')}"></iframe>`:`<video src="${esc(media.url)}" controls autoplay playsinline></video>`;modal.hidden=false;document.body.style.overflow='hidden';closeButton.focus()}
  function closePlayer(){const video=player.querySelector('video');if(video)video.pause();player.replaceChildren();modal.hidden=true;document.body.style.overflow=''}
  function render(){const q=search.value.trim().toLowerCase();const shown=videos.filter(v=>`${v.title} ${v.uploader??''} ${v.sourceUrl??''}`.toLowerCase().includes(q));status.textContent=`${shown.length} archived video${shown.length===1?'':'s'}`;grid.innerHTML=shown.length?shown.map((v,i)=>{const media=playable(v);return `<article class="card" data-index="${i}" tabindex="0" role="button" aria-label="Play ${esc(v.title)}"><div class="thumb">${v.thumbnail?`<img loading="lazy" src="${esc(v.thumbnail)}" alt="">`:'<span class="play">▶</span>'}${media?'<span class="play-badge">▶ Play / Stream</span>':''}</div><div class="body"><h2>${esc(v.title)}</h2><div class="meta">${esc(v.uploader||'Unknown creator')}${v.duration?' · '+duration(v.duration):''}</div><div class="meta">Archived ${v.archivedAt?new Date(v.archivedAt).toLocaleDateString():''}</div><div class="links">${media?'<button class="play-button" type="button">Play / Stream</button>':''}${v.sourceUrl?`<a href="${esc(v.sourceUrl)}" target="_blank" rel="noreferrer">Source ↗</a>`:''}${v.artifactRunUrl?`<a href="${esc(v.artifactRunUrl)}" target="_blank" rel="noreferrer">Artifact ↗</a>`:''}</div></div></article>`}).join(''):'<div class="empty">No archived videos yet. Run the Archive video workflow from GitHub Actions to add one.</div>';grid.querySelectorAll('.card').forEach(card=>{const play=()=>openPlayer(shown[Number(card.dataset.index)]);card.addEventListener('click',e=>{if(e.target.closest('a'))return;play()});card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();play()}})});}
  fetch('data/videos.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).then(v=>{videos=Array.isArray(v)?v:[];render()}).catch(()=>{status.textContent='Could not load archive metadata';render()});search.addEventListener('input',render);closeButton.addEventListener('click',closePlayer);modal.addEventListener('click',e=>{if(e.target===modal)closePlayer()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closePlayer()});
</script></body></html>
