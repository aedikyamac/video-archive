name: Archive video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: Video URL to archive
        required: true
        type: string

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install yt-dlp and ffmpeg
        run: |
          python -m pip install --upgrade yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download video and metadata
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          mkdir -p archive-output
          yt-dlp \
            --no-playlist \
            --format "bv*+ba/b" \
            --merge-output-format mp4 \
            --write-info-json \
            --write-thumbnail \
            --output "archive-output/%(id)s.%(ext)s" \
            "$VIDEO_URL"

      - name: Add metadata record
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'archive-output';
          const infoFile = fs.readdirSync(path).find((name) => name.endsWith('.info.json'));
          if (!infoFile) throw new Error('yt-dlp did not produce an info JSON file');
          const info = JSON.parse(fs.readFileSync(`${path}/${infoFile}`, 'utf8'));
          const videosPath = 'data/videos.json';
          fs.mkdirSync('data', { recursive: true });
          let videos = [];
          if (fs.existsSync(videosPath)) videos = JSON.parse(fs.readFileSync(videosPath, 'utf8'));
          const videoId = String(info.id || info.display_id || Date.now());
          videos = videos.filter((video) => video.id !== videoId);
          videos.unshift({
            id: videoId,
            title: info.title || videoId,
            uploader: info.uploader || info.channel || null,
            sourceUrl: process.env.VIDEO_URL,
            thumbnail: info.thumbnail || null,
            duration: Number.isFinite(info.duration) ? info.duration : null,
            uploadDate: info.upload_date || null,
            archivedAt: new Date().toISOString(),
            artifactRunUrl: process.env.RUN_URL,
            status: 'archived-as-github-artifact'
          });
          fs.writeFileSync(videosPath, `${JSON.stringify(videos, null, 2)}\n`);
          NODE

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: archive-output
          retention-days: 90
          if-no-files-found: error

      - name: Commit archive metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git diff --cached --quiet || git commit -m "Archive video metadata from run ${{ github.run_id }}"
          git push
